
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Forge CrossFit</title>
    <link rel="stylesheet" href="css/cadastro.css">
</head>
<body>

    <header>
        <h1>FORGE <span>CROSSFIT</span></h1>
        <p>Faça seu cadastro e comece sua jornada!</p>
    </header>

    <main>
        <form id="formCadastro">

            <h2>Cadastro</h2>

            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome"
                   placeholder="Digite seu nome" required>

            <label for="nascimento">Data de nascimento</label>
            <input type="date" id="nascimento" name="nascimento" required>
                    

            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf"
                   placeholder="Digite seu CPF" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email"
                   placeholder="Digite seu e-mail" required>

            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone"
                   placeholder="Digite seu telefone" required>

            <label for="cep">CEP</label>
            <input type="text" id="cep" name="cep"
                    placeholder="Digite seu CEP" required>

            <label for="endereco">Endereço</label>
            <input type="text" id="endereco" name="endereco"
                placeholder="Rua e avenida" required>

            <label for="numero">Número</label>
            <input type="text" id="numero" name="numero"
                placeholder="Número da residência" required>

            <label for="bairro">Bairro</label>
            <input type="text" id="bairro" name="bairro"
                placeholder="Digite seu bairro" required>

            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" name="cidade"
                 placeholder="Digite sua cidade" required>

            <label for="estado">Estado</label>
            <input type="text" id="estado" name="estado"
                 placeholder="Ex.: DF" required>

            <label for="plano">Plano escolhido</label>
            <select id="plano" name="plano" required>
                <option value="">Selecione seu plano</option>
                <option value="Mensal">Plano Mensal</option>
                <option value="Anual">Plano Anual</option>
                <option value="Avaliacao">Avaliação</option>
            </select>

            <button type="submit">Enviar cadastro</button>

        </form>
    </main>

</body>
</html>
